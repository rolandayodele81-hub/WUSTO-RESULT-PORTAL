<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin — Manage Students</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style> .wrap{max-width:980px;margin:2rem auto} .muted{color:#9aa} table{width:100%;border-collapse:collapse} th,td{padding:.5rem;border-bottom:1px solid rgba(255,255,255,.06)} .actions button{margin-right:.4rem} </style>
</head>
<body>
  <main class="wrap">
    <h1>Student Management</h1>
    <p class="muted">Search students by matric or name, view semesters, edit or delete records.</p>

    <div style="margin:1rem 0 1.5rem;">
      <input id="searchQ" placeholder="Search matric or name" style="width:70%;padding:.6rem;border-radius:.6rem;border:1px solid rgba(255,255,255,.08);"> 
      <button id="btnSearch" class="button">Search</button>
      <a href="upload-results.html" style="margin-left:1rem;">Upload results</a>
    </div>

    <div id="results"></div>

    <div id="editModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); align-items:center; justify-content:center;">
      <div style="background:var(--panel); padding:1rem; border-radius:.6rem; width:min(980px,95%); max-height:90vh; overflow:auto;">
        <h3 id="modalTitle">Edit Semester</h3>
        <form id="editForm">
          <input type="hidden" id="editSemesterId">
          <div style="display:flex; gap:1rem; margin-bottom:.6rem;">
            <label style="flex:1;">Session<input id="editSession" style="width:100%; padding:.5rem; border-radius:.4rem;" required></label>
            <label style="flex:1;">Semester<input id="editSemester" style="width:100%; padding:.5rem; border-radius:.4rem;" required></label>
          </div>
          <div style="margin-bottom:.6rem;">
            <button id="addCourseRow" type="button" class="button">Add course</button>
          </div>
          <div style="overflow:auto; max-height:50vh;">
            <table id="coursesTable" style="width:100%; border-collapse:collapse;"><thead><tr><th>Code</th><th>Title</th><th>Units</th><th>CA</th><th>Exam</th><th></th></tr></thead><tbody></tbody></table>
          </div>
          <div style="margin-top:.8rem; display:flex; gap:.5rem; justify-content:flex-end;">
            <button id="cancelEdit" type="button" class="button">Cancel</button>
            <button id="saveEdit" type="submit" class="button button-gold">Save changes</button>
          </div>
        </form>
      </div>
    </div>

  </main>

  <script>
    const results = document.getElementById('results');
    document.getElementById('btnSearch').addEventListener('click', async () => {
      const q = document.getElementById('searchQ').value.trim();
      if (!q) return;
      results.innerHTML = '<p class="muted">Searching…</p>';
      try {
        const res = await fetch('../api/search_student.php?q=' + encodeURIComponent(q), { credentials: 'same-origin' });
        const data = await res.json();
        if (!data.results || !data.results.length) { results.innerHTML = '<p class="muted">No students found.</p>'; return; }
        let html = '<table><thead><tr><th>Matric</th><th>Name</th><th>Dept</th><th>Level</th><th></th></tr></thead><tbody>';
        data.results.forEach(s => {
          html += '<tr><td>' + s.matric + '</td><td>' + s.full_name + '</td><td>' + (s.department||'') + '</td><td>' + (s.level||'') + '</td>';
          html += '<td class="actions"><button data-matric="' + s.matric + '" class="btnView">View</button><button data-id="' + s.id + '" class="btnDelete">Delete</button></td></tr>';
        });
        html += '</tbody></table>';
        results.innerHTML = html;
        document.querySelectorAll('.btnView').forEach(btn => btn.addEventListener('click', viewStudent));
        document.querySelectorAll('.btnDelete').forEach(btn => btn.addEventListener('click', deleteStudent));
      } catch (e) { results.innerHTML = '<p class="muted">Search failed.</p>'; }
    });

    async function viewStudent(ev) {
      const matric = ev.target.dataset.matric;
      results.innerHTML = '<p class="muted">Loading…</p>';
      try {
        const res = await fetch('../api/get_student_admin.php?matric=' + encodeURIComponent(matric), { credentials: 'same-origin' });
        const data = await res.json();
        if (!data.found) { results.innerHTML = '<p class="muted">No record found.</p>'; return; }
        const s = data.student;
        let html = '<h2>' + s.full_name + ' · ' + s.matric + '</h2>';
        data.semesters.forEach(sem => {
          html += '<div style="margin:1rem 0; padding:1rem; background:rgba(255,255,255,.02); border-radius:.6rem;">';
          html += '<strong>' + sem.session_name + ' · ' + sem.semester_name + '</strong> <span class="pill">GPA ' + parseFloat(sem.gpa||0).toFixed(2) + ' · CGPA ' + parseFloat(sem.cgpa||0).toFixed(2) + '</span>';
          html += '<div style="margin-top:.6rem;"><table><thead><tr><th>Code</th><th>Title</th><th>Units</th><th>CA</th><th>Exam</th><th>Total</th><th>Grade</th></tr></thead><tbody>';
          (sem.courses||[]).forEach(c => html += '<tr><td>' + c.code + '</td><td>' + c.title + '</td><td>' + c.units + '</td><td>' + c.ca + '</td><td>' + c.exam + '</td><td>' + c.total + '</td><td>' + c.grade + '</td></tr>');
          html += '</tbody></table></div>';
          html += '<div style="margin-top:.6rem;"><button data-sem="' + sem.id + '" class="btnEdit">Edit</button> <button data-sem="' + sem.id + '" class="btnDelSem">Delete Semester</button></div>';
          html += '</div>';
        });
        window.currentStudentData = data;
        results.innerHTML = html;
        document.querySelectorAll('.btnDelSem').forEach(b => b.addEventListener('click', deleteSemester));
        document.querySelectorAll('.btnEdit').forEach(b => b.addEventListener('click', (ev) => openEditForm(Number(ev.target.dataset.sem))));
      } catch (e) { results.innerHTML = '<p class="muted">Failed to load student.</p>'; }
    }

    async function deleteStudent(ev) {
      if (!confirm('Delete this student and all their records?')) return;
      const id = ev.target.dataset.id;
      try {
        const res = await fetch('../api/delete_student.php', { method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ student_id: Number(id) }) });
        const data = await res.json();
        if (data.success) { ev.target.closest('tr').remove(); }
      } catch (e) { alert('Delete failed'); }
    }

    async function deleteSemester(ev) {
      if (!confirm('Delete this semester?')) return;
      const sem = ev.target.dataset.sem;
      try {
        const res = await fetch('../api/delete_semester.php', { method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ semester_id: Number(sem) }) });
        const data = await res.json();
        if (data.success) {
          ev.target.closest('div[style]').remove();
        }
      } catch (e) { alert('Delete failed'); }
    }

    function openEditForm(semId) {
      const data = window.currentStudentData;
      if (!data) return alert('No student data');
      const sem = (data.semesters || []).find(s => Number(s.id) === Number(semId));
      if (!sem) return alert('Semester not found');
      document.getElementById('editSemesterId').value = sem.id;
      document.getElementById('editSession').value = sem.session_name || '';
      document.getElementById('editSemester').value = sem.semester_name || '';
      const tbody = document.querySelector('#coursesTable tbody');
      tbody.innerHTML = '';
      (sem.courses || []).forEach(c => addCourseRow(c));
      document.getElementById('editModal').style.display = 'flex';
    }

    function addCourseRow(course) {
      const tbody = document.querySelector('#coursesTable tbody');
      const tr = document.createElement('tr');
      tr.innerHTML = '<td><input class="rowCode" value="' + (course.code || '') + '" style="width:100%"></td>' +
                     '<td><input class="rowTitle" value="' + (course.title || '') + '" style="width:100%"></td>' +
                     '<td><input class="rowUnits" type="number" value="' + (course.units || 0) + '" style="width:70px"></td>' +
                     '<td><input class="rowCa" type="number" value="' + (course.ca || 0) + '" style="width:70px"></td>' +
                     '<td><input class="rowExam" type="number" value="' + (course.exam || 0) + '" style="width:70px"></td>' +
                     '<td><button type="button" class="btnRemove">Remove</button></td>';
      tbody.appendChild(tr);
      tr.querySelector('.btnRemove').addEventListener('click', () => tr.remove());
    }

    document.getElementById('addCourseRow').addEventListener('click', () => addCourseRow({}));
    document.getElementById('cancelEdit').addEventListener('click', (e) => { e.preventDefault(); document.getElementById('editModal').style.display = 'none'; });

    document.getElementById('editForm').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const semesterId = Number(document.getElementById('editSemesterId').value);
      const sessionName = document.getElementById('editSession').value.trim();
      const semesterName = document.getElementById('editSemester').value.trim();
      const rows = Array.from(document.querySelectorAll('#coursesTable tbody tr'));
      const courses = rows.map(r => ({
        code: r.querySelector('.rowCode').value.trim(),
        title: r.querySelector('.rowTitle').value.trim(),
        units: Number(r.querySelector('.rowUnits').value) || 0,
        ca: Number(r.querySelector('.rowCa').value) || 0,
        exam: Number(r.querySelector('.rowExam').value) || 0
      }));
      try {
        const res = await fetch('../api/update_semester.php', { method: 'POST', credentials: 'same-origin', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ semester_id: semesterId, session: sessionName, semester: semesterName, courses }) });
        const data = await res.json();
        if (data.success) {
          document.getElementById('editModal').style.display = 'none';
          // refresh view for current student
          if (window.currentStudentData && window.currentStudentData.student) {
            // simulate a viewStudent event using matric
            const fakeEvent = { target: { dataset: { matric: window.currentStudentData.student.matric } } };
            viewStudent(fakeEvent);
          } else {
            location.reload();
          }
        } else {
          alert(data.error || 'Save failed');
        }
      } catch (e) { alert('Save request failed'); }
    });

  </script>
</body>
</html>
