<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Wesley University</title>
  <style>
    :root { color-scheme: dark; --bg:#07111f; --panel:#101a2c; --text:#f7efe2; --muted:#b7bfca; --accent:#d4a017; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:Inter, Arial, sans-serif; background:linear-gradient(135deg, var(--bg), #12263d); color:var(--text); min-height:100vh; display:grid; place-items:center; padding:1rem; }
    .card { width:min(100%, 460px); background:var(--panel); border:1px solid rgba(255,255,255,.08); border-radius:1rem; padding:1.4rem; box-shadow:0 20px 45px rgba(0,0,0,.25); }
    h1 { margin-top:0; margin-bottom:.3rem; }
    .muted { color:var(--muted); }
    form { display:grid; gap:1rem; margin-top:1.2rem; }
    label { display:grid; gap:.45rem; font-weight:600; }
    input, button { padding:.85rem 1rem; border-radius:.8rem; border:1px solid rgba(255,255,255,.12); font:inherit; }
    input { background:rgba(255,255,255,.06); color:var(--text); }
    button { background:var(--accent); color:#211402; font-weight:700; cursor:pointer; }
    .error { color:#ff9aa3; margin-top:.7rem; }
    a { color:#ffd56d; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Admin access</h1>
    <p class="muted">Use your admin credentials to reach the protected results upload panel.</p>
    <form id="adminLoginForm">
      <label>Username
        <input id="adminUsername" type="text" placeholder="admin" required>
      </label>
      <label>Password
        <input id="adminPassword" type="password" placeholder="Enter password" required>
      </label>
      <button type="submit">Sign in</button>
    </form>
    <p id="loginMessage" class="error" role="alert"></p>
    <p class="muted" style="margin-top:1rem;">Demo credentials: <strong>admin</strong> / <strong>wesley2026</strong></p>
  </main>

  <script>
    const form = document.getElementById('adminLoginForm');
    const msg = document.getElementById('loginMessage');
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const username = document.getElementById('adminUsername').value.trim();
      const password = document.getElementById('adminPassword').value;
      if (username === 'admin' && password === 'wesley2026') {
        localStorage.setItem('wesleyAdminAuth', 'true');
        window.location.href = 'upload-results.html';
      } else {
        msg.textContent = 'Invalid admin credentials. Please try again.';
      }
    });
  </script>
</body>
</html>
